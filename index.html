
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyecto de Realidad Aumentada</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f2f2f2;
      padding: 20px;
    }
    model-viewer {
      width: 100%;
      height: 70vh;
      background: white;
    }
  </style>
</head>
<body>
  <h2>Proyecto de Realidad Aumentada</h2>
  <p>Visualización del modelo tridimensional</p>

  <model-viewer
    src="modelo_RA.glb"
    alt="Modelo 3D del proyecto"
    ar
    ar-modes="scene-viewer webxr"
    camera-controls
    auto-rotate
    shadow-intensity="1">
  </model-viewer>
</body>
</html>
